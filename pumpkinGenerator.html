
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Halloween Pumpkin Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #35140d 0%, #170805 70%);
            color: #f5e6c8;
            font-family: "Cinzel", Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: min(1250px, 100%);
            display: grid;
            grid-template-columns: minmax(500px, 1fr) 360px;
            gap: 30px;
            align-items: start;
        }

        /* CANVAS */

        .canvas-wrapper {
            background: #100604;
            border: 3px solid #7d3518;
            box-shadow: 0 0 0 2px #32130c, 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 12px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #180906;
        }

        /* CONTROLS */

        .controls {
            background: #21100c;
            border: 2px solid #713119;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 0 2px #35150e, 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            color: #ff8c25;
            font-size: 25px;
            line-height: 1.35;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #b98c6b;
            font-size: 11px;
            line-height: 1.8;
            font-family: Georgia, serif;
        }

        /* SECTIONS */

        .control-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #572217;
        }

        .section-title {
            margin-bottom: 12px;
            color: #ff8c25;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* LABELS */

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #f1c58f;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #100705;
            color: #ffad4d;
            border: 1px solid #713119;
            outline: none;
            font-family: monospace;
            font-size: 13px;
        }

        input[type="text"]:focus {
            border-color: #ff7b20;
        }

        /* SLIDERS */

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #ff711c;
            cursor: pointer;
        }

        .value {
            min-width: 34px;
            text-align: right;
            color: #ff9b3d;
            font-family: monospace;
            font-size: 11px;
        }

        /* DROPDOWNS */

        select {
            width: 100%;
            padding: 9px;
            background: #100705;
            color: #ffad4d;
            border: 1px solid #713119;
            outline: none;
            font-family: "Cinzel", Georgia, serif;
            font-size: 11px;
            cursor: pointer;
        }

        select:focus {
            border-color: #ff7b20;
        }

        /* BUTTONS */

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 25px;
        }

        button {
            padding: 11px 6px;
            background: #45190f;
            color: #ffd39b;
            border: 1px solid #9b431d;
            font-family: "Cinzel", Georgia, serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover {
            background: #713119;
            border-color: #ff8c25;
        }

        button:active {
            transform: translateY(2px);
        }

        button:focus-visible {
            outline: 2px solid #ffad4d;
            outline-offset: 3px;
        }

        /* SEED DISPLAY */

        .seed-display {
            margin-top: 20px;
            padding: 10px;
            background: #100705;
            border: 1px solid #492015;
            color: #b9784c;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }

        .seed-display span {
            color: #ff9a38;
        }

        /* MOBILE */

        @media (max-width: 900px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .controls {
                max-height: none;
            }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 22px;
            }

            .canvas-wrapper {
                padding: 6px;
            }

            .controls {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- CANVAS -->

        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="800"></canvas>
        </div>

        <!-- CONTROLS -->

        <div class="controls">
            <h1>HALLOWEEN PUMPKIN</h1>

            <p class="subtitle">
                Procedurally generate thousands of different
                Halloween pumpkins by changing the seed and
                facial parameters.
            </p>

            <!-- SEED -->

            <label for="seedInput">SEED</label>
            <input
                id="seedInput"
                type="text"
                value="CRYPT-001"
                autocomplete="off"
            >

            <!-- GENERAL -->

            <div class="control-section">
                <div class="section-title">GENERAL</div>

                <label for="weirdSlider">Face Weirdness</label>
                <div class="slider-row">
                    <input id="weirdSlider" type="range" min="0" max="100" value="40">
                    <span id="weirdValue" class="value">40</span>
                </div>

                <label for="detailSlider">Pumpkin Details</label>
                <div class="slider-row">
                    <input id="detailSlider" type="range" min="0" max="100" value="50">
                    <span id="detailValue" class="value">50</span>
                </div>
            </div>

            <!-- EYES -->

            <div class="control-section">
                <div class="section-title">EYES</div>

                <label for="eyeShape">Eye Shape</label>
                <select id="eyeShape">
                    <option value="random">Random</option>
                    <option value="round">Round</option>
                    <option value="soft">Soft</option>
                    <option value="sleepy">Sleepy</option>
                    <option value="slit">Slit</option>
                    <option value="triangle">Triangle</option>
                    <option value="angry">Angry</option>
                    <option value="evil">Evil</option>
                </select>

                <label for="eyeSizeSlider">Eye Size</label>
                <div class="slider-row">
                    <input id="eyeSizeSlider" type="range" min="50" max="160" value="100">
                    <span id="eyeSizeValue" class="value">100</span>
                </div>

                <label for="eyeSpacingSlider">Eye Spacing</label>
                <div class="slider-row">
                    <input id="eyeSpacingSlider" type="range" min="45" max="150" value="85">
                    <span id="eyeSpacingValue" class="value">85</span>
                </div>

                <label for="eyeHeightSlider">Eye Height</label>
                <div class="slider-row">
                    <input id="eyeHeightSlider" type="range" min="-60" max="60" value="0">
                    <span id="eyeHeightValue" class="value">0</span>
                </div>

                <label for="eyeTiltSlider">Eye Tilt</label>
                <div class="slider-row">
                    <input id="eyeTiltSlider" type="range" min="-100" max="100" value="0">
                    <span id="eyeTiltValue" class="value">0</span>
                </div>

                <label for="eyeAsymmetrySlider">Eye Asymmetry</label>
                <div class="slider-row">
                    <input id="eyeAsymmetrySlider" type="range" min="0" max="100" value="15">
                    <span id="eyeAsymmetryValue" class="value">15</span>
                </div>
            </div>

            <!-- NOSE -->

            <div class="control-section">
                <div class="section-title">NOSE</div>

                <label for="noseShape">Nose Shape</label>
                <select id="noseShape">
                    <option value="random">Random</option>
                    <option value="triangle">Triangle</option>
                    <option value="holes">Holes</option>
                    <option value="diamond">Diamond</option>
                    <option value="split">Split</option>
                    <option value="crooked">Crooked</option>
                    <option value="hook">Hook</option>
                </select>

                <label for="noseSizeSlider">Nose Size</label>
                <div class="slider-row">
                    <input id="noseSizeSlider" type="range" min="50" max="160" value="90">
                    <span id="noseSizeValue" class="value">90</span>
                </div>

                <label for="noseWidthSlider">Nose Width</label>
                <div class="slider-row">
                    <input id="noseWidthSlider" type="range" min="50" max="160" value="100">
                    <span id="noseWidthValue" class="value">100</span>
                </div>

                <label for="noseHeightSlider">Nose Height</label>
                <div class="slider-row">
                    <input id="noseHeightSlider" type="range" min="-20" max="100" value="45">
                    <span id="noseHeightValue" class="value">45</span>
                </div>

                <label for="noseTiltSlider">Nose Tilt</label>
                <div class="slider-row">
                    <input id="noseTiltSlider" type="range" min="-100" max="100" value="0">
                    <span id="noseTiltValue" class="value">0</span>
                </div>
            </div>

            <!-- MOUTH -->

            <div class="control-section">
                <div class="section-title">MOUTH</div>

                <label for="mouthShape">Mouth Shape</label>
                <select id="mouthShape">
                    <option value="random">Random</option>
                    <option value="small">Small</option>
                    <option value="grin">Grin</option>
                    <option value="jagged">Jagged</option>
                    <option value="fangs">Fangs</option>
                    <option value="crooked">Crooked</option>
                    <option value="scream">Scream</option>
                    <option value="stitched">Stitched</option>
                    <option value="serrated">Serrated</option>
                </select>

                <label for="mouthWidthSlider">Mouth Width</label>
                <div class="slider-row">
                    <input id="mouthWidthSlider" type="range" min="50" max="170" value="100">
                    <span id="mouthWidthValue" class="value">100</span>
                </div>

                <label for="mouthHeightSlider">Mouth Height</label>
                <div class="slider-row">
                    <input id="mouthHeightSlider" type="range" min="50" max="170" value="100">
                    <span id="mouthHeightValue" class="value">100</span>
                </div>

                <label for="mouthPositionSlider">Mouth Position</label>
                <div class="slider-row">
                    <input id="mouthPositionSlider" type="range" min="80" max="190" value="145">
                    <span id="mouthPositionValue" class="value">145</span>
                </div>

                <label for="teethSlider">Teeth Amount</label>
                <div class="slider-row">
                    <input id="teethSlider" type="range" min="0" max="14" value="7">
                    <span id="teethValue" class="value">7</span>
                </div>

                <label for="mouthChaosSlider">Mouth Chaos</label>
                <div class="slider-row">
                    <input id="mouthChaosSlider" type="range" min="0" max="100" value="40">
                    <span id="mouthChaosValue" class="value">40</span>
                </div>
            </div>

            <!-- BUTTONS -->

            <div class="buttons">
                <button id="generateButton" type="button">GENERATE</button>
                <button id="randomButton" type="button">RANDOM</button>
                <button id="exportButton" type="button">EXPORT PNG</button>
                <button id="copySeedButton" type="button">COPY SEED</button>
            </div>

            <div class="seed-display">
                SEED:
                <span id="seedDisplay">CRYPT-001</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        const seedInput = document.getElementById("seedInput");
        const seedDisplay = document.getElementById("seedDisplay");

        function updateSeedDisplay() {
            seedDisplay.textContent = seedInput.value.trim() || "HALLOWEEN";
        }

        seedInput.addEventListener("input", updateSeedDisplay);
        updateSeedDisplay();
    </script>
</body>
</html>
